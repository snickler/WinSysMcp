name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test tests/WinSysMcp.Tests --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  build-aot:
    name: Build Native AOT (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runner: windows-11-arm
          - runtime: win-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish AOT
        run: dotnet publish src/WinSysMcp -c Release -r ${{ matrix.runtime }} -o publish/${{ matrix.runtime }}

      - name: Upload AOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsysmcp-${{ matrix.runtime }}
          path: publish/${{ matrix.runtime }}/winsysmcp.exe
