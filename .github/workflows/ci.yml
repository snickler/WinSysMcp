name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (JIT)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/WinSysMcp

      - name: Build
        run: dotnet build src/WinSysMcp --no-restore -c Debug

      - name: Pack NuGet package
        run: dotnet pack src/WinSysMcp -c Release -o artifacts/packages /p:PublishAot=false /p:Version=0.0.0-ci.${{ github.run_number }}

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsysmcp-nuget-package
          path: artifacts/packages/*.nupkg

#      - name: Test
#        run: dotnet test tests/WinSysMcp.Tests --no-build -c Debug --logger "trx;LogFileName=results.trx"

#      - name: Upload test results
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: test-results
#          path: '**/TestResults/*.trx'

  build-aot:
    name: Build (Native AOT)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish AOT (arm64)
        run: dotnet publish src/WinSysMcp -c Release -r win-arm64 -o publish/arm64

      - name: Publish AOT (x64)
        run: dotnet publish src/WinSysMcp -c Release -r win-x64 -o publish/x64

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsysmcp-win-arm64
          path: publish/arm64/winsysmcp.exe

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsysmcp-win-x64
          path: publish/x64/winsysmcp.exe
