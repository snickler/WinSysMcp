name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runner: windows-11-arm
          - runtime: win-x64
            runner: windows-latest
          - runtime: linux-x64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test tests/WinSysMcp.Tests -r ${{ matrix.runtime }} --logger "trx;LogFileName=results-${{ matrix.runtime }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.runtime }}
          path: '**/TestResults/*.trx'

  build:
    name: Build Release (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runner: windows-11-arm
            artifact: winsysmcp.exe
            staged: winsysmcp-win-arm64.exe
          - runtime: win-x64
            runner: windows-latest
            artifact: winsysmcp.exe
            staged: winsysmcp-win-x64.exe
          - runtime: linux-x64
            runner: ubuntu-latest
            artifact: winsysmcp
            staged: winsysmcp-linux-x64
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: winsysmcp
            staged: winsysmcp-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish AOT
        run: dotnet publish src/WinSysMcp -c Release -r ${{ matrix.runtime }} -o publish/${{ matrix.runtime }}

      - name: Stage release binary
        shell: pwsh
        run: |
          Copy-Item "publish/${{ matrix.runtime }}/${{ matrix.artifact }}" "publish/${{ matrix.staged }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsysmcp-${{ matrix.runtime }}
          path: publish/${{ matrix.staged }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: publish
          pattern: winsysmcp-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/winsysmcp-win-arm64.exe
            publish/winsysmcp-win-x64.exe
            publish/winsysmcp-linux-x64
            publish/winsysmcp-linux-arm64
          generate_release_notes: true
