name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Release (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-arm64
            runner: windows-11-arm
          - runtime: win-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish AOT
        run: dotnet publish src/WinSysMcp -c Release -r ${{ matrix.runtime }} -o publish/${{ matrix.runtime }}

      - name: Stage release binary
        shell: pwsh
        run: |
          Copy-Item publish/${{ matrix.runtime }}/winsysmcp.exe publish/winsysmcp-${{ matrix.runtime }}.exe

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsysmcp-${{ matrix.runtime }}
          path: publish/winsysmcp-${{ matrix.runtime }}.exe

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: publish
          pattern: winsysmcp-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/winsysmcp-win-arm64.exe
            publish/winsysmcp-win-x64.exe
          generate_release_notes: true
