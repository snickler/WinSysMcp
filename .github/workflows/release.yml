name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test tests/WinSysMcp.Tests -c Debug

      - name: Set package version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack NuGet package
        run: dotnet pack src/WinSysMcp -c Release -o artifacts/packages /p:PublishAot=false /p:Version=${{ env.PACKAGE_VERSION }}

      - name: Publish AOT (arm64)
        run: dotnet publish src/WinSysMcp -c Release -r win-arm64 -o publish/arm64

      - name: Publish AOT (x64)
        run: dotnet publish src/WinSysMcp -c Release -r win-x64 -o publish/x64

      - name: Rename binaries
        shell: pwsh
        run: |
          Copy-Item publish/arm64/winsysmcp.exe publish/winsysmcp-win-arm64.exe
          Copy-Item publish/x64/winsysmcp.exe   publish/winsysmcp-win-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/*.nupkg
            publish/winsysmcp-win-arm64.exe
            publish/winsysmcp-win-x64.exe
          generate_release_notes: true

      - name: Publish NuGet package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
            Write-Warning "NUGET_API_KEY is not configured; skipping NuGet publish."
            exit 0
          }

          dotnet nuget push artifacts/packages/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
